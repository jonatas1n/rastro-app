name: rastro
description: Rastro — consciência financeira diária
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Notificações
  flutter_notification_listener: ^1.4.0

  # Estado
  provider: ^6.1.1

  # Banco de dados local
  sqflite: ^2.3.0
  path: ^1.9.0

  # Notificações locais (resumo diário)
  flutter_local_notifications: ^19.5.0

  # Utilitários
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0

  # HTTP + UUID para sync
  http: ^1.2.1
  crypto: ^3.0.6
  uuid: ^4.3.3
  timezone: ^0.10.1
  flutter_svg: ^2.2.2
  local_auth: ^2.3.0
  local_auth_android: ^1.0.52

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.svg
    - assets/icon/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#1D9E75"
  adaptive_icon_foreground: "assets/icon/logo_foreground.png"
  min_sdk_android: 26
